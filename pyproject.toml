[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iip-platform"
version = "0.1.0-alpha"
description = "Institutional Investment Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "IIP Team"}]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "click>=8.1",
    "rich>=13.7",
    "pypdf>=4.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
iip = "iip.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Achado em 11/09/2026: o projeto nunca teve secao [tool.ruff], entao a
# selecao de regras dependia inteiramente da versao instalada do ruff
# (0.16.6 aqui, 0.15.22 na maquina do usuario) -- resultados
# completamente diferentes (191 vs 403 erros) so por causa disso.
# Fixando explicitamente pra ficar igual em qualquer maquina.
target-version = "py312"
# Historico arquivado e material a revisar nao sao codigo mantido: ficam fora
# do lint (eram 326 dos 403 erros do "ruff check ."). O CI ja so olhava
# src/ e tests/, entao isto so alinha o "ruff check ." local com ele.
extend-exclude = ["archive", "_lixo_para_revisar"]

[tool.ruff.lint]
# Conjunto que ja estava sendo tratado como padrao real do projeto
# nesta sessao: F401/I001 (basicos ja corrigidos), BLE001 (except
# generico -- pede noqa+justificativa quando intencional), RUF012
# (mutable default em dataclass -- bug real na maioria das vezes),
# S1xx (except-pass/except-continue silenciosos), DTZ0xx (datetime
# sem timezone -- noqa quando for so data de calendario), C4xx/SIM1xx/
# PYI034/ISC004 (limpeza mecanica de baixo risco).
#
# Deliberadamente FORA por enquanto (nao escondido -- adiado): ao
# selecionar as categorias amplas "E" e "F", apareceram 238 F403 +
# 131 F405 (uso de "from x import *") e 19 E402 (import fora do topo
# do arquivo) nunca vistos nas rodadas anteriores desta sessao --
# volume grande demais pra triar sem revisao propria, fica como item
# futuro separado. ISC004 tambem fora: e regra "preview" no ruff
# 0.15.x (exige preview=true pra funcionar) e ja estavel no 0.16.x --
# a unica ocorrencia real ja foi corrigida manualmente no codigo, nao
# vale manter uma regra que se comporta diferente por versao so pra
# prevencao futura.
select = [
    "F401", "F841",
    "I001",
    "BLE001",
    "RUF012", "RUF059",
    "S110", "S112",
    "DTZ005", "DTZ011",
    "C401", "C408",
    "SIM103", "SIM117",
    "PYI034",
    "EXE001",
    "PLR0133",
]

# Scripts avulsos (diagnosticos, patches pontuais, testes manuais de fonte):
# nao sao o pacote entregue. O "except Exception" aqui e deliberado (o script
# reporta o erro e segue) e datetime.now() e so carimbo de log. As regras de
# higiene (F401/F841/I001) continuam valendo neles.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["BLE001", "S110", "S112", "DTZ005", "DTZ011", "RUF059"]
"examples/**" = ["BLE001", "S110", "S112", "DTZ005", "DTZ011", "RUF059"]
"RUN_*.py" = ["BLE001", "DTZ005"]
"reconhecer_*.py" = ["BLE001"]
"diagnosticar_*.py" = ["BLE001"]
"testar_*.py" = ["BLE001", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=iip --cov-report=term-missing"
asyncio_mode = "auto"