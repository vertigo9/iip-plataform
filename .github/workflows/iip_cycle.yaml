name: IIP Portfolio Refresh Pipeline

on:
  schedule:
    - cron: '0 21 * * 1-5' # Segunda a Sexta às 18:00 BRT (21:00 UTC)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Executar Regressão e Validação
        run: python -m pytest tests/ -v