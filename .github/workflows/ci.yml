name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pacote (instalacao limpa, editavel, com dev deps)
        run: pip install -e ".[dev]"

      - name: Ruff (lint) -- bloqueante
        run: ruff check src/ tests/ --exclude src/iip_knowledge_bridge

      - name: Compile check -- bloqueante
        run: python -m compileall -q src/

      - name: Pytest -- bloqueante
        run: pytest tests/ --no-cov

      - name: Black (checagem de formatacao) -- informativo, nao bloqueia ainda
        # Achado em 12/09/2026: 70 arquivos ainda nao seguem o padrao do
        # black (nunca foi aplicado no projeto). Bloquear o CI nisso agora
        # faria a primeira execucao nascer vermelha por um motivo que nao
        # tem relacao com a mudanca sendo validada. Fica visivel aqui
        # (aparece como "failed" neste step especifico, sem derrubar o
        # job todo) ate virar uma tarefa deliberada de formatacao em lote,
        # do mesmo jeito que o Ruff foi tratado (nao em massa, com testes
        # a cada lote).
        continue-on-error: true
        run: black --check --diff src/ tests/ --exclude "iip_knowledge_bridge"
