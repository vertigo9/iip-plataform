name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar o pacote (instalacao limpa, editavel, com dev deps)
        run: pip install -e ".[dev]"

      - name: Ruff (lint) -- bloqueante
        run: ruff check src/ tests/ --exclude src/iip_knowledge_bridge

      - name: Compile check -- bloqueante
        run: python -m compileall -q src/

      - name: Pytest -- bloqueante
        run: pytest tests/ --no-cov

      - name: Black (checagem de formatacao) -- bloqueante
        # Aplicado em lote em 19/09/2026 (190 arquivos, com testes a cada lote).
        # A versao-alvo (py312) e a exclusao ficam em [tool.black] do pyproject.
        run: black --check --diff src/ tests/ --exclude "iip_knowledge_bridge"
